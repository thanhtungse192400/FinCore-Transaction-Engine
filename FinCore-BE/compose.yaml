services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: fincore-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=fincore_db
      - POSTGRES_USER=fincore_user
      - POSTGRES_PASSWORD=fincore_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
