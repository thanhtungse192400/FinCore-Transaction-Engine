spring.application.name=FinCore-BE

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fincore_db}
spring.datasource.username=${DB_USERNAME:fincore_user}
spring.datasource.password=${DB_PASSWORD:fincore_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Mail (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply.fincore@gmail.com}
spring.mail.password=${MAIL_PASSWORD:default_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Security & JWT Properties (loaded from .env)
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# 15 minutes (in milliseconds)
application.security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
# 7 days (in milliseconds)
application.security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
# OTP Expiration in minutes
application.security.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}

# Cron Schedule for Token Blacklist & Expired Tokens Cleanup (Every day at 2:00 AM)
application.cleanup.cron=0 0 2 * * *

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
